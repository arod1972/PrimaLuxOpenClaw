<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PrimaLux Pulse</title>
  <meta name="theme-color" content="#0c0d0c" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg:#0c0d0c; --elev:#121412; --surface:#161816; --surface-2:#1c1f1c;
      --fg:#e7ebe4; --muted:#8b9288; --subtle:#6a7068; --border:#262926;
      --accent:#8fa39a; --good:#8fa39a; --warn:#c4a574; --bad:#c17b6a;
      --shadow:0 0 0 1px rgb(255 255 255 / .07);
      --radius-sm:8px; --radius:16px; --radius-lg:24px;
      --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px;
      --motion-quick:150ms; --motion-fast:250ms; --ease:cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing:border-box; }
    html,body { margin:0; background:var(--bg); color:var(--fg); font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    body { min-height:100dvh; }
    button, textarea, input { font:inherit; color:inherit; }
    button { background:none; border:0; cursor:pointer; }
    button:not(:disabled), [role="button"]:not(:disabled) { cursor:pointer; }
    button:disabled { cursor:not-allowed; }
    a { color:var(--accent); }
    h1,h2,h3 { text-wrap:balance; }
    p { text-wrap:pretty; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    header.app {
      position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
      gap:.75rem; min-height:3.5rem; padding:.35rem 1rem; max-width:76rem; margin:0 auto;
      border-bottom:1px solid var(--border); background:color-mix(in srgb,var(--bg) 92%,transparent); backdrop-filter:blur(10px);
    }
    .brand { display:flex; align-items:center; gap:.65rem; min-width:0; }
    .mark { width:1.75rem; height:1.75rem; display:grid; place-items:center; border-radius:6px; background:var(--surface-2); color:var(--accent); box-shadow:var(--shadow); flex-shrink:0; }
    .brand b { font-weight:500; font-size:.9rem; display:block; letter-spacing:-.01em; }
    .brand small { display:none; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--subtle); }
    @media (min-width:640px){ .brand small { display:block; } }
    nav.links { display:flex; gap:.1rem; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    nav.links a {
      height:2.75rem; display:flex; align-items:center; padding:0 .7rem; font-size:.875rem;
      color:var(--muted); border-radius:6px; text-decoration:none; white-space:nowrap;
      transition: color var(--motion-quick) var(--ease);
    }
    nav.links a.on, nav.links a:hover { color:var(--fg); }
    .wrap { max-width:76rem; margin:0 auto; padding:1.25rem 1rem 5rem; }
    .card { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:1.15rem 1.25rem; }
    .label { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--subtle); }
    h1 { font-size:clamp(1.25rem, 1.1rem + .6vw, 1.6rem); font-weight:500; letter-spacing:-.03em; margin:.25rem 0 0; }
    h2 { font-size:.95rem; font-weight:500; margin:0; }
    p.muted { color:var(--muted); font-size:.85rem; line-height:1.5; }
    .good { color:var(--good); } .warn { color:var(--warn); } .bad { color:var(--bad); }
    .dot { width:.5rem; height:.5rem; border-radius:99px; display:inline-block; }
    .dot.good { background:var(--good); } .dot.warn { background:var(--warn); } .dot.bad { background:var(--bad); }
    .led { animation:led 1.8s ease-in-out infinite; }
    @keyframes led { 50% { opacity:.35; transform:scale(.82); } }
    @media (prefers-reduced-motion: reduce) { .led { animation:none; } }
    .row { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
    .btn {
      min-height:2.75rem; padding:0 1rem; border-radius:var(--radius-sm); background:var(--surface-2); box-shadow:var(--shadow);
      font-size:.875rem; font-weight:500; transition: transform var(--motion-quick) var(--ease), box-shadow var(--motion-quick) var(--ease);
    }
    .btn:hover { box-shadow:0 0 0 1px rgb(255 255 255 / .12); }
    .btn:active { transform:scale(.98); }
    .btn.primary { background:var(--accent); color:#0c0d0c; box-shadow:none; }
    .btn.danger { background:color-mix(in srgb,var(--bad) 18%, transparent); color:var(--bad); }
    .btn:disabled { opacity:.4; }
    .grid { display:grid; gap:.75rem; }
    @media (min-width:720px){ .grid.cards { grid-template-columns:repeat(3, minmax(0,1fr)); } .grid.two { grid-template-columns:1fr 1fr; } }
    @media (min-width:960px){ .grid.hero { grid-template-columns:minmax(0,22rem) minmax(0,1fr); } }
    a.seat { display:flex; flex-direction:column; gap:.35rem; min-height:8.75rem; padding:1rem; text-decoration:none; color:inherit; border-radius:var(--radius); transition: box-shadow var(--motion-fast) var(--ease); }
    a.seat:hover { box-shadow:0 0 0 1px rgb(255 255 255 / .12); }
    .badge { font-size:11px; padding:.2rem .5rem; border-radius:99px; border:1px solid var(--border); color:var(--muted); }
    .badge.good { color:var(--good); border-color:color-mix(in srgb,var(--good) 35%, var(--border)); }
    .badge.warn { color:var(--warn); border-color:color-mix(in srgb,var(--warn) 35%, var(--border)); }
    .badge.bad { color:var(--bad); }
    textarea, input[type=text] {
      width:100%; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:.75rem .85rem; color:var(--fg);
    }
    textarea:focus, input:focus { outline:2px solid color-mix(in srgb,var(--accent) 45%, transparent); outline-offset:1px; }
    textarea.talk { min-height:5.5rem; resize:vertical; }
    textarea.ed { min-height:22rem; resize:vertical; line-height:1.5; font-size:13px; }
    .banner { margin:0 0 1rem; padding:.95rem 1.1rem; border-radius:12px; background:var(--surface-2); box-shadow:var(--shadow); font-size:.9rem; color:var(--muted); }
    .banner.warn { color:var(--warn); }
    pre.log { margin:0; font-size:12px; color:var(--muted); white-space:pre-wrap; max-height:28rem; overflow:auto; line-height:1.45; }
    .toast { position:fixed; bottom:1rem; right:1rem; background:var(--surface-2); padding:.75rem 1rem; border-radius:var(--radius-sm); box-shadow:var(--shadow); font-size:.85rem; z-index:40; max-width:22rem; }
    .tabs { display:flex; gap:.25rem; margin:.75rem 0; overflow-x:auto; }
    .tabs button { min-height:2.5rem; padding:0 .75rem; border-radius:6px; color:var(--muted); font-size:.85rem; white-space:nowrap; }
    .tabs button.on { color:var(--fg); background:var(--surface-2); }
    .facts { display:grid; gap:.55rem; margin-top:1rem; }
    .facts div { display:grid; grid-template-columns:7.5rem 1fr; gap:.5rem; font-size:.8rem; }
    .facts dt { color:var(--subtle); }
    .facts dd { margin:0; color:var(--muted); overflow-wrap:anywhere; }
    .finding { display:grid; gap:.35rem; }
    .finding p { margin:0; font-size:.9rem; }
    .finding .hint { color:var(--subtle); font-size:.8rem; }
    .thread { display:grid; gap:.65rem; margin-top:.85rem; }
    .bubble { padding:.85rem 1rem; border-radius:12px; background:var(--bg); font-size:.9rem; line-height:1.5; white-space:pre-wrap; }
    .bubble.me { background:var(--surface-2); }
    .empty { color:var(--muted); font-size:.9rem; padding:.5rem 0; }
    .stat { font-variant-numeric:tabular-nums; }
    .meters { display:grid; grid-template-columns:1fr 1fr; gap:1rem 1.5rem; }
    .bar { height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
    .bar > i { display:block; height:100%; border-radius:99px; background:var(--accent); }
    .bar.warn > i { background:var(--warn); } .bar.bad > i { background:var(--bad); }
    .word { font-size:clamp(2rem, 4.5vw, 2.8rem); font-weight:500; letter-spacing:-.03em; line-height:1; margin:0; }
    a.svc { min-height:8.5rem; display:flex; flex-direction:column; padding:1rem; text-decoration:none; color:inherit; }
    a.svc:hover { box-shadow:0 0 0 1px rgb(255 255 255 / .12); }
    .spark { width:100%; height:7rem; display:block; }
    .logrow { display:grid; grid-template-columns:7.5rem 6.5rem 1fr; gap:.75rem; padding:.65rem 0; border-bottom:1px solid var(--border); font-size:.8rem; }
    @media (max-width:700px){ .logrow { grid-template-columns:1fr; gap:.15rem; } }
    .dropzone { border:1px dashed rgb(255 255 255 / .16); border-radius:var(--radius); padding:1.75rem 1.25rem; text-align:center; background:var(--bg); cursor:pointer; }
    .dropzone:hover, .dropzone.on { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 8%, var(--bg)); }
    .dropzone p { margin:.35rem 0 0; }
    body.pop { overflow:hidden; }
    body.pop header.app { display:none !important; }
    body.pop .wrap { max-width:none; padding:0; min-height:100dvh; }
    .talk-pop { display:flex; flex-direction:column; height:100dvh; background:var(--bg); }
    .talk-pop-head { display:flex; gap:.75rem; align-items:center; padding:.85rem 1rem; border-bottom:1px solid var(--border); background:var(--surface); }
    .talk-pop-head h1 { font-size:1.15rem; margin:0; }
    .talk-pop .thread { flex:1; overflow:auto; padding:1rem; margin:0; }
    .talk-pop-in { padding:.75rem 1rem 1rem; border-top:1px solid var(--border); background:var(--surface); }
    .talk-pop-in textarea.talk { min-height:4.2rem; }
    .seat-actions { margin-top:.45rem; }
    .spark { height:4.5rem; }
    .toast { bottom:5.25rem; right:1.15rem; }
    .strip { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:1rem 1.25rem; }
    @media (max-width:800px){ .strip { grid-template-columns:1fr 1fr; } }
    .seat { display:flex; flex-direction:row; align-items:center; gap:.85rem; text-decoration:none; color:inherit; }
    .seat:hover { box-shadow:0 0 0 1px rgb(255 255 255 / .12); }
    .seat .go { margin-left:auto; font-size:12px; color:var(--muted); background:transparent; box-shadow:none; min-height:2.25rem; padding:0 .5rem; }
    .seat .go:hover { color:var(--fg); }
    .cmd-fab {
      position:fixed; right:1.15rem; bottom:1.15rem; z-index:45;
      width:3.25rem; height:3.25rem; border-radius:14px; overflow:hidden;
      background:var(--surface-2); box-shadow:0 0 0 1px rgb(255 255 255 / .1), 0 12px 32px rgb(0 0 0 / .45);
      padding:0; transition: transform var(--motion-fast) var(--ease);
    }
    .cmd-fab:hover { transform:translateY(-1px); }
    .cmd-fab img { width:100%; height:100%; object-fit:cover; display:block; }
    .cmd-fab .n {
      position:absolute; top:-.2rem; right:-.2rem; min-width:1.1rem; height:1.1rem; padding:0 .28rem;
      border-radius:99px; background:var(--accent); color:#0c0d0c; font-size:10px; font-weight:600;
      display:grid; place-items:center;
    }
    .cmd {
      position:fixed; right:1rem; bottom:1rem; z-index:50;
      width:min(26.5rem, calc(100vw - 1.5rem)); height:min(40rem, calc(100dvh - 5.5rem));
      display:flex; flex-direction:column;
      background:var(--elev); border-radius:20px;
      box-shadow:0 0 0 1px rgb(255 255 255 / .1), 0 24px 64px rgb(0 0 0 / .5);
      overflow:hidden;
      transform-origin:bottom right;
    }
    .cmd[hidden] { display:none !important; }
    .cmd-head { display:flex; align-items:center; gap:.7rem; padding:.85rem 1rem; border-bottom:1px solid var(--border); background:var(--surface); }
    .cmd-head h2 { font-size:1rem; }
    .cmd-head .ico { min-height:2.25rem; width:2.25rem; padding:0; border-radius:8px; color:var(--muted); background:transparent; box-shadow:none; }
    .cmd-head .ico:hover { color:var(--fg); background:var(--surface-2); }
    .cmd-people { display:flex; flex-wrap:wrap; gap:.35rem; padding:.55rem 1rem 0; }
    .chip { display:inline-flex; align-items:center; gap:.35rem; height:1.6rem; padding:0 .5rem 0 .2rem; border-radius:99px; background:var(--surface-2); font-size:11px; color:var(--muted); }
    .chip img { width:1.15rem; height:1.15rem; border-radius:99px; object-fit:cover; }
    .cmd .thread { flex:1; overflow:auto; padding:.75rem 1rem 1rem; margin:0; align-content:start; }
    .msg { display:grid; grid-template-columns:2rem 1fr; gap:.65rem; }
    .msg img { width:2rem; height:2rem; border-radius:6px; object-fit:cover; }
    .msg .who { font-size:12px; font-weight:500; }
    .msg .when { font-size:11px; color:var(--subtle); margin-left:.4rem; font-variant-numeric:tabular-nums; }
    .msg .bd { margin:.15rem 0 0; font-size:.9rem; line-height:1.45; white-space:pre-wrap; color:var(--fg); }
    .cmd-in { padding:.75rem 1rem 1rem; border-top:1px solid var(--border); background:var(--surface); }
    .cmd-in textarea { min-height:3.4rem; resize:none; border-radius:10px; }
    .mention {
      position:absolute; left:1rem; right:1rem; bottom:5.6rem; background:var(--surface-2);
      border-radius:10px; box-shadow:0 0 0 1px rgb(255 255 255 / .1); max-height:10rem; overflow:auto; z-index:2;
    }
    .mention button { display:flex; width:100%; gap:.55rem; align-items:center; padding:.45rem .7rem; min-height:2.4rem; text-align:left; border-radius:0; box-shadow:none; background:transparent; font-size:.85rem; }
    .mention button:hover { background:var(--surface); }
    body.pop .cmd, body.pop .cmd-fab { display:none !important; }
    body.pop .toast { bottom:1rem; }
    .grid.units { grid-template-columns:repeat(auto-fill, minmax(10.75rem, 1fr)); }
    .unit { min-height:6.25rem; padding:.9rem 1rem; display:flex; flex-direction:column; gap:.3rem; }
    .unit .name { font-weight:500; font-size:.95rem; letter-spacing:-.01em; }
    .ident-row input { margin:0; max-width:14rem; }
    .seat.full { flex-direction:column; align-items:stretch; gap:.75rem; min-height:auto; }
    .seat.full .top { display:flex; gap:.85rem; min-width:0; text-decoration:none; color:inherit; }
    .seat.full .top img { width:3.5rem; height:3.5rem; border-radius:8px; object-fit:cover; outline:1px solid rgb(255 255 255 / .1); outline-offset:-1px; flex-shrink:0; }
    .seat.full .acts { display:flex; flex-wrap:wrap; gap:.35rem; align-items:center; padding-top:.65rem; border-top:1px solid var(--border); }
    .hire-bar { display:grid; grid-template-columns:repeat(auto-fit, minmax(9rem, 1fr)); gap:.55rem; align-items:end; }
    .hire-bar .btn { min-height:2.75rem; }
    @media (prefers-reduced-motion: reduce) {
      .cmd-fab { transition:none; }
    }
  </style>
</head>
<body>
  <header class="app">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="8" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="1" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="8" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>
      </div>
      <div><b>PrimaLux Pulse</b><small>SER10 · OpenClaw</small></div>
    </div>
    <nav class="links">
      <a href="#/" data-nav>Host</a>
      <a href="#/agents" data-nav>Agents</a>
      <a href="#/library" data-nav>Library</a>
      <a href="#/logs" data-nav>Logs</a>
      <a href="#/doctor" data-nav>Doctor</a>
      <a href="#/config" data-nav>Config</a>
      <a href="http://127.0.0.1:18789/" data-openclaw target="_blank" rel="noopener">OpenClaw</a>
    </nav>
  </header>
  <main class="wrap" id="app">Loading…</main>
  <button class="cmd-fab" id="cmd-fab" type="button" aria-label="Open Command" hidden>
    <img id="cmd-fab-img" src="/avatars/legacy.jpg" alt="" />
    <span class="n" id="cmd-fab-n" hidden>0</span>
  </button>
  <aside class="cmd" id="cmd" hidden>
    <div class="cmd-head">
      <div style="min-width:0;flex:1">
        <p class="label">Command</p>
        <h2 id="cmd-title">Team</h2>
      </div>
      <button class="ico" type="button" data-cmd="new" title="New thread" aria-label="New thread">New</button>
      <button class="ico" type="button" data-cmd="window" title="Open in a window" aria-label="Open in a window">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><rect x="1.5" y="3.5" width="8" height="8" rx="1.2" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 1.5h7v7" stroke="currentColor" stroke-width="1.3"/><path d="M12.5 1.5L7 7" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button class="ico" type="button" data-cmd="close" title="Close" aria-label="Close">✕</button>
    </div>
    <div class="cmd-people" id="cmd-people"></div>
    <div class="thread" id="cmd-out"></div>
    <div class="cmd-in" style="position:relative">
      <div class="mention" id="cmd-mentions" hidden></div>
      <textarea id="cmd-in" placeholder="Message the team. @ to bring someone in."></textarea>
      <div class="row" style="margin-top:.55rem">
        <button class="btn primary" type="button" data-cmd="send">Send</button>
        <span class="muted" id="cmd-hint" style="font-size:12px"></span>
      </div>
    </div>
  </aside>
  <div id="toast" class="toast" hidden></div>
<script>
const $ = (s, r=document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
let state = null;
let toastT;
const FILE_TABS = [
  ["soul","SOUL.md"],["agents","AGENTS.md"],["identity","IDENTITY.md"],
  ["user","USER.md"],["tools","TOOLS.md"],["heartbeat","HEARTBEAT.md"],["memory","MEMORY.md"],
];

function toast(msg) {
  const el = $("#toast");
  el.hidden = false; el.textContent = msg;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3400);
}

async function api(path, opts = {}) {
  const { timeout = 25000, ...rest } = opts;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const r = await fetch(path, { headers: { "Content-Type": "application/json" }, signal: ctrl.signal, ...rest });
    const t = await r.text();
    let j; try { j = JSON.parse(t); } catch { j = { raw: t, ok: r.ok }; }
    if (!r.ok) throw new Error(j.error || j.stderr || t.slice(0, 200) || r.statusText);
    return j;
  } catch (err) {
    if (err && err.name === "AbortError") throw new Error("Timed out " + path);
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

function defaultAgent() {
  const list = agents();
  return list.find(a => a.default) || list[0] || null;
}
function channelKey() { return "pulse-cmd-v1"; }
function emptyChannel() {
  const d = defaultAgent();
  return { participants: d ? [d.id] : [], items: [], unread: 0 };
}
function loadChannel() {
  try {
    const raw = JSON.parse(localStorage.getItem(channelKey()) || "null");
    if (raw && Array.isArray(raw.items)) {
      if (!raw.participants || !raw.participants.length) {
        const d = defaultAgent();
        raw.participants = d ? [d.id] : [];
      }
      return raw;
    }
  } catch {}
  return emptyChannel();
}
function saveChannel(ch) {
  try { localStorage.setItem(channelKey(), JSON.stringify({ ...ch, items: (ch.items || []).slice(-80) })); } catch {}
  try { if (talkBus) talkBus.postMessage({ channel: true }); } catch {}
}
function parseMentions(text, roster) {
  const found = [];
  const low = String(text || "").toLowerCase();
  for (const a of roster) {
    const id = String(a.id || "").toLowerCase();
    const name = String(a.name || "").toLowerCase();
    if (!id) continue;
    if (new RegExp("(^|\\s)@" + id + "\\b").test(low)) found.push(a.id);
    else if (name && new RegExp("(^|\\s)@" + name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b").test(low)) found.push(a.id);
  }
  return [...new Set(found)];
}
function avatarOf(a) {
  if (!a) return "/avatars/legacy.jpg";
  return a.avatar || "/avatars/" + a.id + ".jpg";
}
function clockShort(ts) {
  const d = new Date(ts);
  if (Number.isNaN(+d)) return "";
  return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}
function channelBox() {
  return document.querySelector("body.pop #talk-out") || $("#cmd-out") || $("#talk-out");
}
function paintChannel(box, ch) {
  if (!box) box = channelBox();
  if (!box) return;
  const roster = agents();
  const items = ch.items || [];
  if (!items.length) {
    const d = defaultAgent();
    box.innerHTML = `<p class="muted">${d ? esc(d.name) + " is on point. @ a name to bring them in." : "No active seats."}</p>`;
    return;
  }
  box.innerHTML = items.map(x => {
    const a = roster.find(r => r.id === x.agent);
    const src = x.me ? "" : avatarOf(a);
    const name = x.me ? "You" : (x.name || (a && a.name) || x.agent || "Seat");
    const img = x.me
      ? `<span style="width:2rem;height:2rem;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-size:10px;color:var(--subtle)">You</span>`
      : `<img src="${esc(src)}" alt="" onerror="this.src='/avatars/legacy.jpg'" />`;
    return `<div class="msg">
      ${img}
      <div>
        <span class="who">${esc(name)}</span><span class="when">${esc(clockShort(x.ts))}</span>
        <p class="bd ${x.thinking ? "muted" : ""}">${esc(x.text)}</p>

async function sendChannel(userText) {
  const text = (userText || "").trim();
  if (!text) return;
  const roster = agents();
  const def = defaultAgent();
  if (!def) { toast("No active seat"); return; }
  const ch = loadChannel();
  const mentions = parseMentions(text, roster);
  const targets = mentions.length ? mentions : [def.id];
  ch.items.push({ me: true, name: "You", text, ts: Date.now() });
  for (const id of targets) {
    if (!ch.participants.includes(id)) ch.participants.push(id);
  }
  if (!ch.participants.includes(def.id)) ch.participants.unshift(def.id);
  saveChannel(ch);
  paintPeople(ch);
  paintChannel(channelBox() || $("#talk-out"), ch);
  const hint = $("#cmd-hint") || $("#talk-hint");
  for (const tid of targets) {
    const a = roster.find(x => x.id === tid) || { id: tid, name: tid, model: "" };
    const wait = { me: false, agent: tid, name: a.name || tid, text: (modelLabel(a.model) === "Grok" ? "Grok" : "Qwen") + " is thinking…", ts: Date.now(), thinking: true };
    ch.items.push(wait);
    saveChannel(ch);
    paintChannel(channelBox(), ch);
    const t0 = Date.now();
    const grok = modelLabel(a.model) === "Grok";
    if (hint) hint.textContent = grok ? "Waiting on xAI…" : "Local model — 30–90s is normal";
    const tick = setInterval(() => {
      wait.text = (grok ? "Grok" : "Qwen") + " is thinking… " + Math.round((Date.now() - t0) / 1000) + "s";
      paintChannel(channelBox(), ch);
    }, 500);
    try {
      const d = await api("/api/talk", {
        method: "POST",
        body: JSON.stringify({ agent: tid, message: wrapForSeat(tid, text, ch), newSession: false }),
        timeout: 240000,
      });
      wait.thinking = false;
      wait.text = d.reply || d.error || d.raw || "No reply.";
      const invited = parseMentions(wait.text, roster).filter(id => id !== tid);
      for (const iid of invited) {
        if (!ch.participants.includes(iid)) ch.participants.push(iid);
      }
      saveChannel(ch);
      paintPeople(ch);
      paintChannel(channelBox(), ch);
      for (const iid of invited) {
        await routeInvite(iid, a.name || tid, text, ch);
      }
    } catch (err) {
      wait.thinking = false;
      wait.text = "Stopped: " + err.message;
      saveChannel(ch);
      paintChannel(channelBox(), ch);
    } finally {
      clearInterval(tick);
      if (hint) hint.textContent = "";
    }
  }
  if ($("#cmd").hidden && !hash().startsWith("/talk/")) {
    ch.unread = (ch.unread || 0) + 1;
    saveChannel(ch);
    setFab(ch);
  }
}
async function routeInvite(id, byName, userText, ch) {
  const roster = agents();
  const a = roster.find(x => x.id === id) || { id, name: id, model: "" };
  const wait = { me: false, agent: id, name: a.name || id, text: "Joining…", ts: Date.now(), thinking: true };
  ch.items.push(wait);
  saveChannel(ch);
  paintPeople(ch);
  paintChannel(channelBox() || $("#talk-out"), ch);
  try {
    const d = await api("/api/talk", {
      method: "POST",
      body: JSON.stringify({
        agent: id,
        message: wrapForSeat(id, userText, ch) + "\n\n" + byName + " brought you in. Answer the operator.",
        newSession: false,
      }),
      timeout: 240000,
    });
    wait.thinking = false;
    wait.text = d.reply || d.error || "No reply.";
  } catch (err) {
    wait.thinking = false;
    wait.text = "Stopped: " + err.message;
  }
  saveChannel(ch);
  paintChannel(channelBox() || $("#talk-out"), ch);
}

function bindDock() {
  const fab = $("#cmd-fab");
  if (fab) fab.onclick = () => openCommand();
  const panel = $("#cmd");
  if (!panel || panel.dataset.bound) return;
  panel.dataset.bound = "1";
  panel.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-cmd]");
    if (!b) return;
    const act = b.dataset.cmd;
    if (act === "close") return closeCommand();
    if (act === "window") return openCommandWindow();
    if (act === "new") {
      const next = emptyChannel();
      saveChannel(next);
      paintPeople(next);
      paintChannel(channelBox(), next);
      toast("New thread");
      return;
    }
    if (act === "send") {
      const field = panel.querySelector("textarea");
      const msg = field && field.value;
      if (field) field.value = "";
      b.disabled = true;
      try { await sendChannel(msg); } finally { b.disabled = false; }
    }
  });
  const ta = panel.querySelector("textarea");
  if (ta) {
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        const send = panel.querySelector("[data-cmd=send]");
        if (send) send.click();
      }
    });
    ta.addEventListener("input", () => {
      const box = $("#cmd-mentions");
      const v = ta.value;
      const m = v.match(/(^|\s)@([a-z0-9-]*)$/i);
      if (!m || !box) { if (box) box.hidden = true; return; }
      const q = m[2].toLowerCase();
      const hits = agents().filter(a => a.id.includes(q) || String(a.name||"").toLowerCase().includes(q)).slice(0, 6);
      if (!hits.length) { box.hidden = true; return; }
      box.hidden = false;
      box.innerHTML = hits.map(a => `<button type="button" data-mention="${esc(a.id)}"><img src="${esc(avatarOf(a))}" width="20" height="20" style="width:1.2rem;height:1.2rem;border-radius:99px;object-fit:cover" alt="" />${esc(a.name)} <span class="muted">@${esc(a.id)}</span></button>`).join("");
    });
  }
  const box = $("#cmd-mentions");
  if (box) box.addEventListener("click", (e) => {
    const b = e.target.closest("[data-mention]");
    if (!b) return;
    const field = panel.querySelector("textarea");
    field.value = field.value.replace(/@([a-z0-9-]*)$/i, "@" + b.dataset.mention + " ");
    box.hidden = true;
    field.focus();
  });
  document.addEventListener("keydown", (e) => {

  });
}

function tone(s) {

    : s === "unresponsive" || s === "silent" ? "subtle" : "bad";

function word(s) {

}
function pct(n) { return Number.isFinite(n) ? Math.round(n) + "%" : "—"; }
function mem(mb) { return !mb ? "—" : mb >= 1024 ? (mb/1024).toFixed(mb>=10240?0:1) + " GB" : Math.round(mb) + " MB"; }
function dur(s) {

  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60);
  if (d) return d+"d "+h+"h"; if (h) return h+"h "+m+"m"; if (m) return m+"m"; return s+"s";

function modelLabel(m) {
  const s = String(m || "").trim();

  if (low.includes("xai") || low.includes("grok")) return "Grok";
  if (low.includes("qwen") || low.startsWith("local")) return "Qwen 9B";
  return s.replace(/^[^/]+\//, "");
}
function unitLabel(s) {
  const id = String(s.id || s.unit || "").toLowerCase();

  const blob = id + " " + name.toLowerCase();
  if (blob.includes("openclaw")) return "OpenClaw";
  if (blob.includes("talktrack")) return "TalkTrack";
  if (blob.includes("tailscale")) return "Tailscale";
  if (blob.includes("ollama")) return "Ollama";
  if (blob.includes("qwen") || blob.includes("llama")) return "Qwen";
  if (blob.includes("clawbox") || blob.includes("pulse")) {
    if (blob.includes("collector") && !blob.includes("dashboard")) return "Collector";
    return "Pulse";

function lastWhen(v) {
  if (v == null || v === "") return "";
  const n = Number(v);
  if (Number.isFinite(n) && n > 1e12) return clock(new Date(n).toISOString());
  if (Number.isFinite(n) && n > 1e9 && n < 1e12) return clock(new Date(n * 1000).toISOString());
  const d = new Date(v);
  if (!Number.isNaN(+d)) return clock(d.toISOString());
  return "";
}

const HOST_NOISE = /drmmodeatomiccommit|cursor update failed|xdg-desktop-portal|gsd-|pipewire|wireplumber|meta_window|stack_position|gnome-shell|mutter|at-spi2/i;
function age(ms) {
  const s = Math.floor((ms||0)/1000);
  if (s < 5) return "just now"; if (s < 60) return s+"s ago";
  const m = Math.floor(s/60); if (m < 60) return m+"m ago";
  return Math.floor(m/60)+"h ago";
}
function clock(iso) {
  const d = new Date(iso); if (Number.isNaN(+d)) return "—";
  return d.toLocaleString(undefined, {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
}
function spark(history) {
  if (!history || history.length < 2) return `<p class="muted">Collecting load samples…</p>`;
  const w = 640, h = 112, pad = 8;
  const xs = history.map((_, i) => pad + i * ((w - pad*2) / (history.length-1)));
  const line = (key, color) => {
    const vals = history.map(p => Number(p[key]) || 0);
    const max = Math.max(100, ...vals);
    const pts = vals.map((v,i) => `${xs[i].toFixed(1)},${(h-pad - (v/max)*(h-pad*2)).toFixed(1)}`).join(" ");
    return `<polyline fill="none" stroke="${color}" stroke-width="1.6" points="${pts}" />`;
  };
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${line("cpu","#8fa39a")}${line("ram","rgba(231,235,228,.45)")}${line("npu","#c4a574")}</svg>`;
}
function meter(label, value, display, warnAt, badAt) {
  const t = badAt != null && value >= badAt ? "bad" : warnAt != null && value >= warnAt ? "warn" : "";
  const w = Math.max(0, Math.min(100, value||0));
  return `<div><div style="display:flex;justify-content:space-between;gap:.5rem;margin-bottom:.35rem">
    <span class="label">${esc(label)}</span><span class="mono ${t}" style="font-size:12px">${esc(display)}</span>
  </div><div class="bar ${t}"><i style="width:${w}%"></i></div></div>`;
}

    }

    if (th) {

  }).catch(() => { const th = $("#an-threads"); if (th) th.textContent = "Usage unavailable"; });
  const tabs = [...$("#app").querySelectorAll("[data-tab]")];
  tabs.forEach(t => t.onclick = () => {

    FILE_TABS.forEach(([k]) => {

  $("#app").onclick = async (e) => {

      if (b.dataset.act === "retire") {

        if (d && d.ok === false) throw new Error(d.error || "retire failed");
        toast("Retired " + id);

  };
  paintShell(a.files || {});
  api(`/api/agents/${id}/files`, { timeout: 12000 }).then(d => {

      if (el && document.activeElement !== el) el.value = d[k] || "";
    });

function renderLibrary() {
  $("#app").innerHTML = `
    <p class="label">Working set</p>
    <h1>Library</h1>
    <p class="muted" style="max-width:42rem;margin:.4rem 0 1rem">Drop Journey PDFs, Markdown, Word, HTML, folders, or a URL — same ingest path as TalkTrack. Sync writes <span class="mono">KNOWLEDGE.md</span> and <span class="mono">knowledge/</span> into the active seats.</p>

      <div class="dropzone" id="lib-drop" tabindex="0">
        <p class="label">Drop files or folders</p>

        <p class="muted mono" id="lib-drop-status" style="margin-top:.75rem"></p>
        <input id="lib-files" type="file" multiple hidden accept=".md,.txt,.pdf,.docx,.html,.htm,.csv,.json,.xml,.rtf" />
      </div>
    </section>
    <section class="card" style="margin-top:.75rem">
      <p class="label">Presets</p>
      <div class="row" id="presets" style="margin-top:.75rem"></div>
    </section>
    <div class="grid two" style="margin-top:.75rem">
      <section class="card">
        <p class="label">Add URL</p>
        <input id="lib-url" type="text" placeholder="https://www.ncua.gov/…" style="margin:.6rem 0" />
        <div class="row"><button class="btn primary" id="lib-fetch">Fetch</button></div>
      </section>
      <section class="card">
        <p class="label">Paste Journey / notes</p>
        <input id="lib-title" type="text" placeholder="PrimaLux Journey — Discover" style="margin:.6rem 0" />
        <textarea id="lib-text" class="talk" placeholder="Paste handbook text, workshop notes, phase definitions…"></textarea>
        <div class="row" style="margin-top:.6rem"><button class="btn" id="lib-paste">Save paste</button></div>
      </section>
    </div>
    <div class="row" style="margin:1rem 0">
      <button class="btn primary" id="lib-sync">Sync to seats</button>
      <span class="muted" id="lib-sync-out"></span>
    </div>
    <section>
      <p class="label">Ingested</p>
      <div id="lib-list" style="margin-top:.65rem">…</div>
    </section>`;
  const paint = (d) => {
    const presets = d.presets || [];
    $("#presets").innerHTML = presets.map(p => `<button class="btn" data-preset="${esc(p.id)}" title="${esc(p.summary || p.url || "")}">${esc(p.title)}</button>`).join("");
    const items = d.items || [];
    $("#lib-list").innerHTML = items.length ? items.map(it => `
      <article class="card" style="margin-bottom:.65rem;padding:1rem 1.1rem">
        <div class="row" style="justify-content:space-between;align-items:flex-start;gap:.75rem">
          <div style="min-width:0;flex:1">
            <div class="row" style="gap:.4rem;flex-wrap:wrap">
              <strong style="font-weight:500">${esc(it.title || it.id)}</strong>
              <span class="badge ${it.status === "blocked" ? "warn" : ""}">${esc(it.source || it.status || "source")}</span>
            </div>
            <p style="margin:.45rem 0 0;font-size:.92rem;line-height:1.45">${esc(it.summary || "Summary pending — open this source once to generate.")}</p>
            <p class="muted mono" style="font-size:12px;margin:.45rem 0 0">${esc(it.url || "pasted")} · ${esc(it.status === "blocked" ? "blocked" : (it.fetchedAt || ""))}${it.bytes ? " · " + it.bytes + " B" : ""}</p>
          </div>
          <button class="btn danger" data-del="${esc(it.id)}" style="min-height:2.25rem">Remove</button>
        </div>
      </article>`).join("") : `<p class="muted">Nothing ingested yet. Fetch a regulator URL or paste Journey notes.</p>`;
  };
  const reload = () => api("/api/library").then(paint).catch(err => { $("#lib-list").innerHTML = `<p class="bad">${esc(err.message)}</p>`; });
  reload();
  const statusEl = $("#lib-drop-status");
  const setStatus = (m) => { if (statusEl) statusEl.textContent = m || ""; };
  const walkEntry = (entry) => new Promise((resolve) => {
    if (!entry) return resolve([]);
    if (entry.isFile) {
      entry.file(f => resolve([f]), () => resolve([]));
      return;
    }
    if (!entry.isDirectory) return resolve([]);
    const reader = entry.createReader();
    const out = [];
    const read = () => reader.readEntries(async (batch) => {
      if (!batch.length) return resolve(out);
      for (const e of batch) {
        if (e.name && e.name.startsWith(".")) continue;
        out.push(...await walkEntry(e));
      }
      read();
    }, () => resolve(out));
    read();
  });
  const filesFromDrop = async (dt) => {
    const items = [...(dt.items || [])];
    if (items.some(i => i.webkitGetAsEntry && i.webkitGetAsEntry())) {
      const nested = await Promise.all(items.map(i => walkEntry(i.webkitGetAsEntry())));
      return nested.flat().filter(Boolean);
    }
    return [...(dt.files || [])];
  };
  const fileToB64 = (file) => new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const s = String(r.result || "");
      resolve(s.includes(",") ? s.split(",")[1] : s);
    };
    r.onerror = () => reject(new Error("read failed"));
    r.readAsDataURL(file);
  });
  const ingestFiles = async (files) => {
    const list = [...files].filter(f => f && f.size && !f.name.startsWith("."));
    if (!list.length) { toast("Nothing to ingest"); return; }
    let ok = 0, fail = 0;
    for (let i = 0; i < list.length; i++) {
      const f = list[i];
      setStatus("Ingesting " + (i+1) + "/" + list.length + " · " + f.name);
      try {
        const contentB64 = await fileToB64(f);
        const d = await api("/api/library", { method:"POST", body: JSON.stringify({ filename: f.name, mime: f.type, contentB64 }), timeout: 60000 });
        if (d && d.ok === false) throw new Error(d.error || "failed");
        ok++;
      } catch (err) {
        fail++;
        toast(f.name + ": " + err.message);
      }
    }
    setStatus((ok ? ok + " ingested" : "None ingested") + (fail ? " · " + fail + " failed" : ""));
    toast(ok + " file" + (ok===1?"":"s") + " ingested");
    await reload();
  };
  const ingestUrls = async (urls) => {
    for (const url of urls) {
      setStatus("Fetching " + url);
      try {
        const d = await api("/api/library", { method:"POST", body: JSON.stringify({ url }), timeout: 40000 });
        if (d && d.ok === false) throw new Error(d.error || "failed");
        toast("Fetched " + (d.title || url));
      } catch (err) { toast(err.message); }
    }
    setStatus("");
    await reload();
  };
  const zone = $("#lib-drop");
  const picker = $("#lib-files");
  zone.onclick = (e) => { if (e.target.closest("input")) return; picker.click(); };
  picker.onchange = () => ingestFiles(picker.files || []);
  ["dragenter","dragover"].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation(); zone.classList.add("on");
  }));
  ["dragleave","dragend"].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); zone.classList.remove("on");
  }));
  zone.addEventListener("drop", async (e) => {
    e.preventDefault(); e.stopPropagation(); zone.classList.remove("on");
    const uri = (e.dataTransfer.getData("text/uri-list") || "").trim();
    const text = (e.dataTransfer.getData("text/plain") || "").trim();
    const urls = (uri || (text.startsWith("http") ? text : "")).split(/\s+/).filter(u => /^https?:\/\//i.test(u));
    if (urls.length && !(e.dataTransfer.files && e.dataTransfer.files.length)) {
      await ingestUrls(urls);
      return;
    }
    const files = await filesFromDrop(e.dataTransfer);
    await ingestFiles(files);
  });
  $("#lib-fetch").onclick = async () => {
    const url = $("#lib-url").value.trim();
    if (!url) return;
    $("#lib-fetch").disabled = true;
    try {
      const d = await api("/api/library", { method:"POST", body: JSON.stringify({ url }), timeout: 40000 });
      if (d && d.ok === false) throw new Error(d.error || "fetch failed");
      toast(d.warning || ("Fetched " + (d.title || url)));
      $("#lib-url").value = "";
      await reload();
    } catch (err) { toast(err.message); }
    finally { $("#lib-fetch").disabled = false; }
  };
  $("#lib-paste").onclick = async () => {
    const title = $("#lib-title").value.trim() || "Journey / note";
    const text = $("#lib-text").value.trim();
    if (!text) return;
    $("#lib-paste").disabled = true;
    try {
      const d = await api("/api/library", { method:"POST", body: JSON.stringify({ title, text }) });
      if (d && d.ok === false) throw new Error(d.error || "save failed");
      toast("Saved " + title);
      $("#lib-text").value = "";
      await reload();
    } catch (err) { toast(err.message); }
    finally { $("#lib-paste").disabled = false; }
  };
  $("#lib-sync").onclick = async () => {
    $("#lib-sync").disabled = true;
    try {
      const d = await api("/api/library/sync", { method:"POST", body:"{}", timeout: 30000 });
      $("#lib-sync-out").textContent = "Synced " + (d.sources||0) + " sources → " + (d.seats||[]).join(", ");
      toast("Library synced to seats");
    } catch (err) { toast(err.message); }
    finally { $("#lib-sync").disabled = false; }
  };
  $("#app").onclick = async (e) => {
    const p = e.target.closest("[data-preset]");
    if (p) {
      p.disabled = true;
      try {
        const d = await api("/api/library/preset", { method:"POST", body: JSON.stringify({ id: p.dataset.preset }), timeout: 40000 });
        if (d && d.ok === false) throw new Error(d.error || "preset failed");
        toast(d.warning || ("Fetched " + (d.title || p.dataset.preset)));
        await reload();
      } catch (err) { toast(err.message); }
      finally { p.disabled = false; }
      return;
    }
    const b = e.target.closest("[data-del]");
    if (!b) return;
    if (!confirm("Remove " + b.dataset.del + "?")) return;
    b.disabled = true;
    try {
      await api("/api/library/" + b.dataset.del + "/delete", { method:"POST", body:"{}" });
      toast("Removed");
      await reload();
    } catch (err) { toast(err.message); }
    finally { b.disabled = false; }
  };
}

function renderRoster() {
  const list = agents();
  const standby = state.standby || [];
  $("#app").innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:flex-end;gap:.75rem">
      <div>
        <p class="label">Roster</p>
        <h1>Agents</h1>
        <p class="muted" style="margin:.35rem 0 0">${list.length} active${standby.length ? " · " + standby.length + " on standby" : ""}</p>
      </div>
      <button class="btn" type="button" id="hire-toggle">Hire a seat</button>
    </div>
    <div class="grid cards" style="margin-top:1.15rem">
      ${list.map(agentFullCard).join("") || `<p class="muted">No active seats.</p>`}
    </div>
    <section style="margin-top:1.35rem">
      <div class="row" style="justify-content:space-between;margin-bottom:.65rem">
        <h2>Cold standby</h2>
        <span class="muted" style="font-size:.8rem">${standby.length ? standby.length + " parked" : "Empty"}</span>
      </div>
      <div class="grid cards">
        ${standby.map(a => `
          <article class="card seat full">
            <a class="top" href="#/a/${esc(a.id)}">
              <img src="/avatars/${esc(a.id)}.jpg" alt="" width="56" height="56" onerror="this.src='/avatars/legacy.jpg'" style="filter:grayscale(1);opacity:.7" />
              <span style="min-width:0">
                <span class="label">${esc(a.id)}</span>
                <strong style="display:block;font-weight:500;font-size:1.1rem;margin:.15rem 0">${esc(a.name || a.id)}</strong>
                <span class="muted">${esc(a.title || "")}</span>
              </span>
            </a>
            <div class="acts">
              <button class="btn primary" type="button" data-restore="${esc(a.id)}">Re-activate</button>
              <span style="flex:1"></span>
              <button class="go" type="button" data-fire="${esc(a.id)}" style="color:var(--bad)">Fire</button>
            </div>
          </article>`).join("") || `<p class="muted">Retire an active seat to park it here.</p>`}
      </div>
    </section>
    <section style="margin-top:1.5rem">
      <div class="row" style="justify-content:space-between;align-items:center">
        <p class="label">Hire</p>
        <span class="muted" style="font-size:12px">Infrequent. Id is permanent.</span>
      </div>
      <div class="card" id="hire-box" hidden style="margin-top:.5rem">
        <div class="hire-bar">
          <div>
            <label class="label" for="hire-id">Id</label>
            <input id="hire-id" type="text" placeholder="nora" style="margin:.35rem 0 0" />
          </div>
          <div>
            <label class="label" for="hire-name">Name</label>
            <input id="hire-name" type="text" placeholder="Nora" style="margin:.35rem 0 0" />
          </div>
          <div>
            <label class="label" for="hire-title">Role</label>
            <input id="hire-title" type="text" placeholder="Compliance research" style="margin:.35rem 0 0" />
          </div>
          <div>
            <label class="label" for="hire-model">Model</label>
            <select id="hire-model" style="margin:.35rem 0 0;width:100%;min-height:2.75rem;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:0 .75rem">
              <option value="local">Local Qwen 9B</option>
              <option value="grok">Grok (xAI OAuth)</option>
            </select>
          </div>
          <div>
            <label class="label" for="hire-audience">Audience</label>
            <select id="hire-audience" style="margin:.35rem 0 0;width:100%;min-height:2.75rem;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:0 .75rem">
              <option value="internal">Internal</option>
              <option value="customer">Customer — Library only</option>
            </select>
          </div>
          <button class="btn primary" id="hire">Hire</button>
        </div>
        <p class="muted" style="margin:.65rem 0 0;font-size:12px">Customer seats read Library only. Policy is the guardrail, not a sandbox.</p>
      </div>
    </section>`;
  paintUsage();
  const showHire = (on) => {
    const box = $("#hire-box");
    if (!box) return;
    box.hidden = !on;
    const t = $("#hire-toggle");
    if (t) t.textContent = on ? "Cancel" : "Hire a seat";
    if (on) {
      box.scrollIntoView({ block: "nearest" });
      const name = $("#hire-name");
      if (name) name.focus();
    }
  };
  $("#hire-toggle").onclick = () => showHire($("#hire-box").hidden);
  const nameEl = $("#hire-name");
  const idEl = $("#hire-id");
  if (nameEl && idEl) {
    nameEl.addEventListener("input", () => {
      if (idEl.dataset.touched) return;
      idEl.value = nameEl.value.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 32);
    });
    idEl.addEventListener("input", () => { idEl.dataset.touched = "1"; });
  }
  $("#hire").onclick = async () => {
    const id = $("#hire-id").value.trim();
    const name = $("#hire-name").value.trim();
    const title = $("#hire-title").value.trim();
    const model = $("#hire-model").value;
    const audience = $("#hire-audience").value;
    if (!id) { toast("Id required"); return; }
    $("#hire").disabled = true;
    try {
      const d = await api("/api/roster/hire", { method:"POST", body: JSON.stringify({ id, name, title, model, audience }), timeout: 60000 });
      if (d && d.ok === false) throw new Error(d.error || "hire failed");
      toast("Hired " + (d.name || id));
      await refresh();
    } catch (err) { toast(err.message); }
    finally { $("#hire").disabled = false; }
  };
  $("#app").onclick = async (e) => {
    const inv = e.target.closest("[data-act=invite]");
    if (inv) {
      e.preventDefault();
      openCommand(inv.dataset.id);
      return;
    }
    const r = e.target.closest("[data-retire]");
    const s = e.target.closest("[data-restore]");
    const f = e.target.closest("[data-fire]");
    const b = r || s || f;
    if (!b) return;
    const id = b.dataset.retire || b.dataset.restore || b.dataset.fire;
    if (b.dataset.retire && !confirm("Retire " + id + "? Kept on cold standby.")) return;
    if (b.dataset.restore && !confirm("Re-activate " + id + " on the gateway?")) return;
    if (b.dataset.fire && !confirm("Fire " + id + "? This deletes the seat.")) return;
    b.disabled = true;
    try {
      const path = b.dataset.retire ? "/api/roster/retire" : b.dataset.restore ? "/api/roster/restore" : "/api/roster/fire";
      const d = await api(path, { method:"POST", body: JSON.stringify({ id }), timeout: 60000 });
      if (d && d.ok === false) throw new Error(d.error || "failed");
      toast((b.dataset.retire ? "Retired " : b.dataset.restore ? "Re-activated " : "Fired ") + id);
      await refresh();
    } catch (err) { toast(err.message); }
    finally { b.disabled = false; }
  };
}

function renderDoctor() {
  $("#app").innerHTML = `<div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><p class="label">Health</p><h1>Doctor</h1></div>
      <div class="row">
        <button class="btn" id="scan">Scan</button>
        <button class="btn primary" id="fix">Repair</button>
      </div>
    </div>
    <p class="muted" style="max-width:42rem;margin:.5rem 0 1rem">OpenClaw doctor, triaged. Loopback bind is by design — Pulse is the HTTPS edge. Repair runs housekeeping only (no sudo).</p>
    <div id="doc">Scanning…</div>`;
  const paint = (d) => {
    const findings = d.findings || [];
    const groups = [
      ["action", "Needs a look"],
      ["housekeeping", "OpenClaw housekeeping"],
      ["expected", "By design"],
      ["noise", "Noise"],
    ];
    const lanes = d.lanes || {};
    const summary = [
      lanes.action ? lanes.action + " action" : "",
      lanes.housekeeping ? lanes.housekeeping + " housekeeping" : "",
      lanes.expected ? lanes.expected + " by design" : "",
    ].filter(Boolean).join(" · ") || "No findings";
    const card = (f) => `
        <section class="card finding">
          <div class="row" style="justify-content:space-between">
            <span class="label">${esc(f.checkId || "check")}</span>
            <span class="badge ${f.lane==="action"?"warn": f.lane==="expected"?"good":""}">${esc(f.lane || f.severity || "")}</span>
          </div>
          <p>${esc(f.message)}</p>
          ${f.pulseNote ? `<p class="hint">${esc(f.pulseNote)}</p>` : ""}
          ${f.path ? `<p class="hint mono">${esc(f.path)}</p>` : ""}
          ${f.fixHint && f.lane !== "expected" ? `<p class="hint">${esc(f.fixHint)}</p>` : ""}
        </section>`;
    $("#doc").innerHTML = `
      <p class="muted" style="margin-bottom:.85rem">${esc(summary)}. ${d.repaired ? "Repair applied." : "Read-only scan."}</p>
      ${groups.map(([lane, label]) => {
        const items = findings.filter(f => (f.lane || "action") === lane);
        if (!items.length) return "";
        return `<h2 style="margin:1.1rem 0 .55rem">${esc(label)}</h2><div class="grid">${items.map(card).join("")}</div>`;
      }).join("") || `<section class="card"><p class="good">No findings.</p></section>`}
      ${d.raw ? `<section class="card" style="margin-top:.75rem"><pre class="log mono">${esc(d.raw)}</pre></section>` : ""}`;
  };
  const scan = async () => {
    try { paint(await api("/api/doctor")); }
    catch (err) { $("#doc").innerHTML = `<p class="bad">${esc(err.message)}</p>`; }
  };
  $("#scan").onclick = scan;
  $("#fix").onclick = async () => {
    $("#fix").disabled = true;
    try {
      await api("/api/doctor/fix", { method:"POST", body:"{}" });
      toast("Repair ran");
      await scan();
    } catch (err) { toast(err.message); }
    finally { $("#fix").disabled = false; }
  };
  scan();
}

function renderTalkPop() {
  const d = defaultAgent();
  document.title = "Command · Pulse";
  $("#app").innerHTML = `
    <div class="talk-pop">
      <div class="talk-pop-head">
        <img src="${esc(avatarOf(d))}" alt="" width="44" height="44" onerror="this.src='/avatars/legacy.jpg'" style="width:2.75rem;height:2.75rem;border-radius:6px;object-fit:cover" />
        <div style="min-width:0;flex:1">
          <p class="label">Command</p>
          <h1>${esc(d ? d.name + " · team" : "Team")}</h1>
        </div>
        <button class="btn" data-cmd="new">New</button>
      </div>
      <div class="cmd-people" id="cmd-people"></div>
      <div class="thread" id="talk-out"></div>
      <div class="talk-pop-in">
        <textarea id="cmd-in" class="talk" placeholder="Message the team. @ to bring someone in."></textarea>
        <div class="row" style="margin-top:.55rem">
          <button class="btn primary" data-cmd="send">Send</button>
          <span class="muted" id="cmd-hint" style="font-size:12px"></span>
        </div>
      </div>
    </div>`;
  const ch = loadChannel();
  paintPeople(ch);
  paintChannel($("#talk-out"), ch);
  const ta = $("#cmd-in");
  if (ta) {
    ta.focus();
    ta.onkeydown = (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        $("#app").querySelector("[data-cmd=send]").click();
      }
    };
  }
  $("#app").onclick = async (e) => {
    const b = e.target.closest("[data-cmd]");
    if (!b) return;
    if (b.dataset.cmd === "new") {
      const next = emptyChannel();
      saveChannel(next);
      paintPeople(next);
      paintChannel($("#talk-out"), next);
      return;
    }
    if (b.dataset.cmd === "send") {
      const msg = ta && ta.value;
      if (ta) ta.value = "";
      b.disabled = true;
      try { await sendChannel(msg); } finally { b.disabled = false; }
    }
  };
}

function render() {
  navOn();
  bindControlLinks();
  const h = hash();
  const pop = h.startsWith("/talk/");
  document.body.classList.toggle("pop", pop);
  const hdr = document.querySelector("header.app");
  if (hdr) hdr.hidden = pop;
  if (!pop) document.title = "PrimaLux Pulse";
  bindDock();
  if (pop) return renderTalkPop();
  if (h.startsWith("/a/")) return renderAgent(h.slice(3));
  if (h === "/logs") return renderLogs();
  if (h === "/library") return renderLibrary();
  if (h === "/ops") return renderOps();
  if (h === "/roster" || h === "/agents") return renderRoster();
  if (h === "/doctor") return renderDoctor();
  if (h === "/config") return renderConfig();
  renderOverview();
  setFab(loadChannel());
}

async function refresh() {
  try {
    const s = await api("/api/status", { timeout: 20000 });
    state = Object.assign(state || {}, s);
  } catch (err) {
    if (!state) state = { agents: [], gateway: {} };
    state.error = String(err.message || err);
    toast(state.error);
  }
  render();
}

window.addEventListener("hashchange", () => { if (state) render(); });
state = {
  agents: [],
  standby: [],
  gateway: {},
  titles: {},
  openclawVersion: "2026.8.2",
};
render();
refresh();
setInterval(() => {
  const h = hash();
  if (h === "/" || h === "") fillHost();
}, 15000);
</script>
