<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse · OpenClaw</title>
  <meta name="theme-color" content="#0c0d0c" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg:#0c0d0c; --elev:#121412; --surface:#161816; --surface-2:#1c1f1c;
      --fg:#e7ebe4; --muted:#8b9288; --subtle:#6a7068; --border:#262926;
      --accent:#8fa39a; --good:#8fa39a; --warn:#c4a574; --bad:#c17b6a;
      --shadow:0 0 0 1px rgb(255 255 255 / .07);
      --radius-sm:8px; --radius:16px; --radius-lg:24px;
      --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px;
      --motion-quick:150ms; --motion-fast:250ms; --ease:cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing:border-box; }
    html,body { margin:0; background:var(--bg); color:var(--fg); font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    body { min-height:100dvh; }
    button, textarea, input { font:inherit; color:inherit; }
    button { background:none; border:0; cursor:pointer; }
    button:not(:disabled), [role="button"]:not(:disabled) { cursor:pointer; }
    button:disabled { cursor:not-allowed; }
    a { color:var(--accent); }
    h1,h2,h3 { text-wrap:balance; }
    p { text-wrap:pretty; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    header.app {
      position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
      gap:.75rem; min-height:3.5rem; padding:.35rem 1rem; max-width:76rem; margin:0 auto;
      border-bottom:1px solid var(--border); background:color-mix(in srgb,var(--bg) 92%,transparent); backdrop-filter:blur(10px);
    }
    .brand { display:flex; align-items:center; gap:.65rem; min-width:0; }
    .mark { width:1.75rem; height:1.75rem; display:grid; place-items:center; border-radius:6px; background:var(--surface-2); color:var(--accent); box-shadow:var(--shadow); flex-shrink:0; }
    .brand b { font-weight:500; font-size:.9rem; display:block; letter-spacing:-.01em; }
    .brand small { display:none; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--subtle); }
    @media (min-width:640px){ .brand small { display:block; } }
    nav.links { display:flex; gap:.1rem; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    nav.links a {
      height:2.75rem; display:flex; align-items:center; padding:0 .7rem; font-size:.875rem;
      color:var(--muted); border-radius:6px; text-decoration:none; white-space:nowrap;
      transition: color var(--motion-quick) var(--ease);
    }
    nav.links a.on, nav.links a:hover { color:var(--fg); }
    .wrap { max-width:76rem; margin:0 auto; padding:1.25rem 1rem 5rem; }
    .card { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:1.15rem 1.25rem; }
    .label { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--subtle); }
    h1 { font-size:clamp(1.25rem, 1.1rem + .6vw, 1.6rem); font-weight:500; letter-spacing:-.03em; margin:.25rem 0 0; }
    h2 { font-size:.95rem; font-weight:500; margin:0; }
    p.muted { color:var(--muted); font-size:.85rem; line-height:1.5; }
    .good { color:var(--good); } .warn { color:var(--warn); } .bad { color:var(--bad); }
    .dot { width:.5rem; height:.5rem; border-radius:99px; display:inline-block; }
    .dot.good { background:var(--good); } .dot.warn { background:var(--warn); } .dot.bad { background:var(--bad); }
    .led { animation:led 1.8s ease-in-out infinite; }
    @keyframes led { 50% { opacity:.35; transform:scale(.82); } }
    @media (prefers-reduced-motion: reduce) { .led { animation:none; } }
    .row { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
    .btn {
      min-height:2.75rem; padding:0 1rem; border-radius:var(--radius-sm); background:var(--surface-2); box-shadow:var(--shadow);
      font-size:.875rem; font-weight:500; transition: transform var(--motion-quick) var(--ease), box-shadow var(--motion-quick) var(--ease);
    }
    .btn:hover { box-shadow:0 0 0 1px rgb(255 255 255 / .12); }
    .btn:active { transform:scale(.98); }
    .btn.primary { background:var(--accent); color:#0c0d0c; box-shadow:none; }
    .btn.danger { background:color-mix(in srgb,var(--bad) 18%, transparent); color:var(--bad); }
    .btn:disabled { opacity:.4; }
    .grid { display:grid; gap:.75rem; }
    @media (min-width:720px){ .grid.cards { grid-template-columns:repeat(3, minmax(0,1fr)); } .grid.two { grid-template-columns:1fr 1fr; } }
    @media (min-width:960px){ .grid.hero { grid-template-columns:minmax(0,22rem) minmax(0,1fr); } }
    a.seat { display:flex; flex-direction:column; gap:.35rem; min-height:8.75rem; padding:1rem; text-decoration:none; color:inherit; border-radius:var(--radius); transition: box-shadow var(--motion-fast) var(--ease); }
    a.seat:hover { box-shadow:0 0 0 1px rgb(255 255 255 / .12); }
    .badge { font-size:11px; padding:.2rem .5rem; border-radius:99px; border:1px solid var(--border); color:var(--muted); }
    .badge.good { color:var(--good); border-color:color-mix(in srgb,var(--good) 35%, var(--border)); }
    .badge.warn { color:var(--warn); border-color:color-mix(in srgb,var(--warn) 35%, var(--border)); }
    .badge.bad { color:var(--bad); }
    textarea, input[type=text] {
      width:100%; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:.75rem .85rem; color:var(--fg);
    }
    textarea:focus, input:focus { outline:2px solid color-mix(in srgb,var(--accent) 45%, transparent); outline-offset:1px; }
    textarea.talk { min-height:5.5rem; resize:vertical; }
    textarea.ed { min-height:22rem; resize:vertical; line-height:1.5; font-size:13px; }
    .banner { margin:0 0 1rem; padding:.95rem 1.1rem; border-radius:12px; background:var(--surface-2); box-shadow:var(--shadow); font-size:.9rem; color:var(--muted); }
    .banner.warn { color:var(--warn); }
    pre.log { margin:0; font-size:12px; color:var(--muted); white-space:pre-wrap; max-height:28rem; overflow:auto; line-height:1.45; }
    .toast { position:fixed; bottom:1rem; right:1rem; background:var(--surface-2); padding:.75rem 1rem; border-radius:var(--radius-sm); box-shadow:var(--shadow); font-size:.85rem; z-index:40; max-width:22rem; }
    .tabs { display:flex; gap:.25rem; margin:.75rem 0; overflow-x:auto; }
    .tabs button { min-height:2.5rem; padding:0 .75rem; border-radius:6px; color:var(--muted); font-size:.85rem; white-space:nowrap; }
    .tabs button.on { color:var(--fg); background:var(--surface-2); }
    .facts { display:grid; gap:.55rem; margin-top:1rem; }
    .facts div { display:grid; grid-template-columns:7.5rem 1fr; gap:.5rem; font-size:.8rem; }
    .facts dt { color:var(--subtle); }
    .facts dd { margin:0; color:var(--muted); overflow-wrap:anywhere; }
    .finding { display:grid; gap:.35rem; }
    .finding p { margin:0; font-size:.9rem; }
    .finding .hint { color:var(--subtle); font-size:.8rem; }
    .thread { display:grid; gap:.65rem; margin-top:.85rem; }
    .bubble { padding:.85rem 1rem; border-radius:12px; background:var(--bg); font-size:.9rem; line-height:1.5; white-space:pre-wrap; }
    .bubble.me { background:var(--surface-2); }
    .empty { color:var(--muted); font-size:.9rem; padding:.5rem 0; }
    .stat { font-variant-numeric:tabular-nums; }
    .meters { display:grid; grid-template-columns:1fr 1fr; gap:1rem 1.5rem; }
    .bar { height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
    .bar > i { display:block; height:100%; border-radius:99px; background:var(--accent); }
    .bar.warn > i { background:var(--warn); } .bar.bad > i { background:var(--bad); }
    .word { font-size:clamp(2rem, 4.5vw, 2.8rem); font-weight:500; letter-spacing:-.03em; line-height:1; margin:0; }
    a.svc { min-height:8.5rem; display:flex; flex-direction:column; padding:1rem; text-decoration:none; color:inherit; }
    a.svc:hover { box-shadow:0 0 0 1px rgb(255 255 255 / .12); }
  </style>
</head>
<body>
  <header class="app">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="8" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="1" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="8" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>
      </div>
      <div><b>Pulse</b><small>SER10 · OpenClaw</small></div>
    </div>
    <nav class="links">
      <a href="#/" data-nav>Host</a>
      <a href="#/agents" data-nav>Agents</a>
      <a href="#/doctor" data-nav>Doctor</a>
      <a href="#/logs" data-nav>Logs</a>
      <a href="#/config" data-nav>Config</a>
      <a href="/openclaw/" data-nav>OpenClaw</a>
    </nav>
  </header>
  <main class="wrap" id="app">Loading…</main>
  <div id="toast" class="toast" hidden></div>
<script>
const $ = (s, r=document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
let state = null;
let toastT;
const FILE_TABS = [
  ["soul","SOUL.md"],["agents","AGENTS.md"],["identity","IDENTITY.md"],
  ["user","USER.md"],["tools","TOOLS.md"],["heartbeat","HEARTBEAT.md"],["memory","MEMORY.md"],
];

function toast(msg) {
  const el = $("#toast");
  el.hidden = false; el.textContent = msg;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3400);
}

async function api(path, opts = {}) {
  const { timeout = 25000, ...rest } = opts;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const r = await fetch(path, { headers: { "Content-Type": "application/json" }, signal: ctrl.signal, ...rest });
    const t = await r.text();
    let j; try { j = JSON.parse(t); } catch { j = { raw: t, ok: r.ok }; }
    if (!r.ok) throw new Error(j.error || j.stderr || t.slice(0, 200) || r.statusText);
    return j;
  } catch (err) {
    if (err && err.name === "AbortError") throw new Error("Timed out " + path);
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

function hash() { return location.hash.replace(/^#/, "") || "/"; }
function navOn() {
  document.querySelectorAll("[data-nav]").forEach(a => {
    const h = a.getAttribute("href").slice(1);
    a.classList.toggle("on", hash() === h || (h === "/" && hash().startsWith("/a/")));
  });
}

function gwOk(g) {
  if (!g) return false;
  const s = JSON.stringify(g).toLowerCase();
  return s.includes("running") || s.includes("probe") || s.includes('"ok":true') || g._cliOk;
}

function agents() { return state.agents || []; }
function leftover() { return agents().filter(a => a.legacy); }
function plannedPresent() { return agents().filter(a => a.planned); }

function tone(s) {
  return s === "healthy" || s === "running" || s === "ok" ? "good"
    : s === "degraded" || s === "warn" ? "warn"
    : s === "unresponsive" || s === "silent" ? "subtle" : "bad";
}
function word(s) {
  return ({healthy:"Operational", degraded:"Degraded", down:"Down", unresponsive:"Unresponsive"}[s] || s || "—");
}
function pct(n) { return Number.isFinite(n) ? Math.round(n) + "%" : "—"; }
function mem(mb) { return !mb ? "—" : mb >= 1024 ? (mb/1024).toFixed(mb>=10240?0:1) + " GB" : Math.round(mb) + " MB"; }
function dur(s) {
  s = Math.floor(s||0);
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60);
  if (d) return d+"d "+h+"h"; if (h) return h+"h "+m+"m"; if (m) return m+"m"; return s+"s";
}
function meter(label, value, display, warnAt, badAt) {
  const t = badAt != null && value >= badAt ? "bad" : warnAt != null && value >= warnAt ? "warn" : "";
  const w = Math.max(0, Math.min(100, value||0));
  return `<div><div style="display:flex;justify-content:space-between;gap:.5rem;margin-bottom:.35rem">
    <span class="label">${esc(label)}</span><span class="mono ${t}" style="font-size:12px">${esc(display)}</span>
  </div><div class="bar ${t}"><i style="width:${w}%"></i></div></div>`;
}

async function delAgent(id) {
  const d = await api(`/api/agents/${id}/delete`, { method:"POST", body:"{}" });
  if (d && d.ok === false) throw new Error(d.error || d.stderr || "Delete failed");
  return d;
}

async function delLeftover() {
  const d = await api("/api/agents/leftover", { method:"POST", body:"{}" });
  if (d && d.ok === false) throw new Error(d.error || "Wipe leftover failed");
  return d;
}

function renderOverview() {
  const g = state.gateway || {};
  const ok = gwOk(g);
  const list = agents();
  const legacy = leftover();
  $("#app").innerHTML = `
    ${legacy.length ? `<p class="banner warn" style="display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between">
      <span>${legacy.length} leftover seat${legacy.length===1?"":"s"} — Ken/Aria/Dex and the rest. Delete them here. RESET is not required.</span>
      <span class="row">
        <button class="btn danger" data-act="wipe">Delete leftover</button>
        <button class="btn" data-act="seed">Seed Vera + five</button>
      </span>
    </p>` : ""}
    <div class="grid hero" id="host-hero">
      <section class="card">
        <p class="label">SER10 Max</p>
        <h1 class="word" id="host-word">…</h1>
        <p class="muted" id="host-blurb" style="margin:.6rem 0 0">Reading host heartbeat…</p>
        <div class="facts" id="host-facts"></div>
      </section>
      <section class="card">
        <p class="label">Hardware</p>
        <div class="meters" id="host-meters" style="margin-top:.85rem"></div>
      </section>
    </div>
    <div class="grid hero" style="margin-top:1rem">
      <section class="card">
        <p class="label">OpenClaw gateway</p>
        <h1 class="${ok ? "good" : "bad"}">${ok ? "Running" : "Down"}</h1>
        <p class="muted" style="margin:.5rem 0 0">${esc(state.openclawVersion || "2026.7.1-2")} · loopback :18789 · ${list.length} seats</p>
        <div class="row" style="margin-top:1.15rem">
          <span class="dot ${ok ? "good led" : "bad"}"></span>
          <button class="btn" data-act="restart">Restart</button>
          <button class="btn" data-act="start">Start</button>
          <button class="btn" data-act="stop">Stop</button>
          <a class="btn" href="/openclaw/" style="display:inline-flex;align-items:center;text-decoration:none">Control UI</a>
        </div>
      </section>
      <section class="card">
        <p class="label">Featured units</p>
        <div id="host-svcs" class="grid" style="gap:.45rem;margin-top:.7rem"><p class="muted">Loading units…</p></div>
      </section>
    </div>
    <section style="margin-top:1.35rem">
      <div class="row" style="justify-content:space-between;margin-bottom:.75rem">
        <h2>Agents</h2>
        <a href="#/agents" class="muted" style="font-size:.8rem">All seats</a>
      </div>
      <div class="grid cards">
        ${list.map(a => `
          <a class="card seat" href="#/a/${esc(a.id)}" style="flex-direction:row;align-items:center;gap:.85rem">
            <img src="${esc(a.avatar || "/avatars/" + a.id + ".jpg")}" alt="" width="48" height="48" onerror="this.src='/avatars/legacy.jpg'" style="width:3rem;height:3rem;border-radius:6px;object-fit:cover;outline:1px solid rgb(255 255 255 / .1);outline-offset:-1px;flex-shrink:0" />
            <span style="min-width:0;display:flex;flex-direction:column;gap:.2rem">
              <span class="row" style="justify-content:space-between">
                <span class="label">${esc(a.id)}</span>
                <span class="badge ${a.legacy ? "warn" : a.default ? "good" : ""}">${a.legacy ? "legacy" : a.default ? "default" : "ready"}</span>
              </span>
              <strong style="font-weight:500;font-size:1.15rem">${esc(a.name)}</strong>
              <span class="muted">${esc(a.title || "")}</span>
            </span>
          </a>`).join("") || `<p class="muted">No agents. Seed Vera + five from the banner.</p>`}
      </div>
    </section>`;
  api("/api/dashboard").then(d => {
    const hw = d.hardware || {};
    const ramP = hw.ramTotalMb ? (hw.ramUsedMb/hw.ramTotalMb)*100 : 0;
    const diskP = hw.diskTotalGb ? (hw.diskUsedGb/hw.diskTotalGb)*100 : 0;
    const t = tone(d.overall);
    const el = $("#host-word"); if (el) { el.className = "word " + t; el.textContent = word(d.overall); }
    const bl = $("#host-blurb"); if (bl) bl.textContent = d.stale ? "No recent heartbeat from this box." : (d.os || "Beelink SER10 MAX");
    const facts = $("#host-facts");
    if (facts) facts.innerHTML = `
      <div><dt>Uptime</dt><dd class="mono">${dur(d.uptimeSeconds)}</dd></div>
      <div><dt>Host</dt><dd class="mono">${esc(d.hostname || "—")}</dd></div>
      <div><dt>OS</dt><dd>${esc(d.os || "—")}</dd></div>
      <div><dt>Tailscale</dt><dd class="mono">${esc((d.tailscale && (d.tailscale.ip || d.tailscale.status)) || "—")}</dd></div>`;
    const meters = $("#host-meters");
    if (meters) meters.innerHTML = [
      meter("CPU", hw.cpuPercent||0, pct(hw.cpuPercent), 85, 95),
      meter("RAM", ramP, `${mem(hw.ramUsedMb||0)} / ${mem(hw.ramTotalMb||0)}`, 88, 96),
      meter("NPU", hw.npuPercent||0, pct(hw.npuPercent)),
      meter("Temp", Math.min(100, hw.cpuTempC||0), Math.round(hw.cpuTempC||0)+"°C", 80, 90),
      meter("Disk", diskP, `${hw.diskUsedGb||0}/${hw.diskTotalGb||0} GB`, 85, 95),
    ].join("");
    const svcs = (d.services||[]).filter(s => s.kind === "featured").slice(0,6);
    const box = $("#host-svcs");
    if (box) box.innerHTML = svcs.length ? svcs.map(s => `
      <div class="row" style="justify-content:space-between">
        <span class="row" style="gap:.5rem"><span class="dot ${tone(s.status)}"></span>${esc(s.name)}</span>
        <span class="badge ${tone(s.status)}">${esc(s.status)}</span>
      </div>
      <p class="muted" style="font-size:12px;margin:.1rem 0 .45rem 1.1rem">${esc(s.detail || s.unit || "")}${s.port?` · :${s.port}`:""}</p>
    `).join("") : `<p class="muted">No featured units discovered yet.</p>`;
  }).catch(err => {
    const bl = $("#host-blurb"); if (bl) bl.textContent = err.message;
  });
  $("#app").onclick = async (e) => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    b.disabled = true;
    try {
      const act = b.dataset.act;
      if (act === "restart") await api("/api/gateway/restart", { method:"POST", body:"{}" });
      if (act === "start") await api("/api/gateway/start", { method:"POST", body:"{}" });
      if (act === "stop") await api("/api/gateway/stop", { method:"POST", body:"{}" });
      if (act === "wipe") {
        if (!confirm("Delete leftover Ken / Aria / Dex / Sol / Reggie / Cleo / Connie / Lex / Finn / Ollie / Mira?")) return;
        const d = await delLeftover();
        toast("Deleted leftover (" + ((d.deleted||[]).length) + ")");
        await refresh();
        return;
      }
      if (act === "seed") {
        await api("/api/roster/seed", { method:"POST", body:"{}" });
        toast("Seeded Vera + five");
        await refresh();
        return;
      }
      toast(act + " sent");
      await refresh();
    } catch (err) { toast(err.message); }
    finally { b.disabled = false; }
  };
}

function renderAgent(id) {
  const a = agents().find(x => x.id === id);
  if (!a) { $("#app").innerHTML = `<p class="muted">Unknown agent. <a href="#/agents">Back to agents</a></p>`; return; }
  const paint = (f) => {
  $("#app").innerHTML = `
    <p class="muted"><a href="#/agents" style="color:var(--accent);text-decoration:none">Agents</a> / ${esc(a.id)}</p>
    <div class="row" style="justify-content:space-between;align-items:flex-end;margin:.5rem 0 1rem">
      <div>
        <p class="label">${a.default ? "Default seat" : a.legacy ? "Legacy — delete from this page" : "Operating seat"}</p>
        <h1>${esc(a.name)}</h1>
        <p class="muted">${esc(a.title)} · <span class="mono">${esc(a.model)}</span></p>
      </div>
      <div class="row">
        <button class="btn" data-act="default">Make default</button>
        <button class="btn" data-act="save">Save files</button>
        ${a.id !== "vera" ? `<button class="btn danger" data-act="delete">Delete</button>` : ""}
      </div>
    </div>
    <div class="tabs" id="file-tabs">
      ${FILE_TABS.map(([k,label],i) => `<button class="${i===0?"on":""}" data-tab="${k}">${label}</button>`).join("")}
    </div>
    <section class="card" style="padding:.85rem">
      ${FILE_TABS.map(([k],i) => `<textarea id="ed-${k}" class="mono ed" ${i?"hidden":""}>${esc(f[k] || "")}</textarea>`).join("")}
    </section>
    <section class="card" style="margin-top:1rem">
      <p class="label">Talk</p>
      <p class="muted" style="margin:.35rem 0 .75rem">Sends through the local Qwen 9B seat. Draft only — nothing is posted.</p>
      <textarea id="talk-in" class="talk" placeholder="Ask ${esc(a.name)}…"></textarea>
      <div class="row" style="margin:.6rem 0 0">
        <button class="btn primary" data-act="talk">Send</button>
      </div>
      <div class="thread" id="talk-out"></div>
    </section>
    <section class="card" style="margin-top:1rem">
      <p class="label">Routing bind</p>
      <p class="muted" style="margin:.35rem 0 .75rem">Pin inbound traffic: telegram:* or telegram:ops</p>
      <div class="row">
        <input id="bind-in" type="text" value="telegram:*" style="max-width:16rem" />
        <button class="btn" data-act="bind">Bind</button>
      </div>
    </section>
    <p class="muted mono" style="margin-top:.75rem">${esc(a.workspace)}</p>`;
  const tabs = [...$("#app").querySelectorAll("[data-tab]")];
  tabs.forEach(t => t.onclick = () => {
    tabs.forEach(x => x.classList.toggle("on", x === t));
    FILE_TABS.forEach(([k]) => {
      const el = $("#ed-"+k); if (el) el.hidden = k !== t.dataset.tab;
    });
  });
  $("#app").onclick = async (e) => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    b.disabled = true;
    try {
      if (b.dataset.act === "save") {
        const payload = {};
        FILE_TABS.forEach(([k]) => { payload[k] = $("#ed-"+k).value; });
        await api(`/api/agents/${id}/files`, { method:"POST", body: JSON.stringify(payload) });
        toast("Saved workspace files");
      }
      if (b.dataset.act === "default") {
        await api(`/api/agents/${id}/default`, { method:"POST", body:"{}" });
        toast(id + " is default");
      }
      if (b.dataset.act === "talk") {
        const msg = $("#talk-in").value.trim();
        if (!msg) return;
        const box = $("#talk-out");
        const me = document.createElement("div");
        me.className = "bubble me"; me.textContent = msg;
        box.prepend(me);
        const wait = document.createElement("div");
        wait.className = "bubble"; wait.textContent = "…";
        box.prepend(wait);
        const d = await api("/api/talk", { method:"POST", body: JSON.stringify({ agent: id, message: msg }) });
        wait.textContent = d.reply || JSON.stringify(d, null, 2);
        $("#talk-in").value = "";
        toast(d.ok ? "Replied" : "Talk failed");
        return;
      }
      if (b.dataset.act === "bind") {
        const bind = ($("#bind-in") && $("#bind-in").value.trim()) || "telegram:*";
        await api(`/api/agents/${id}/bind`, { method:"POST", body: JSON.stringify({ bind }) });
        toast("Bound " + bind);
      }
      if (b.dataset.act === "delete") {
        if (!confirm("Delete agent " + id + "?")) return;
        await delAgent(id);
        toast("Deleted " + id);
        location.hash = "#/agents";
        await refresh();
        return;
      }
      await refresh();
    } catch (err) { toast(err.message); }
    finally { b.disabled = false; }
  };
  };
  paint(a.files || {});
  api(`/api/agents/${id}/files`, { timeout: 12000 }).then(d => {
    const files = {};
    FILE_TABS.forEach(([k]) => { files[k] = d[k] || ""; });
    paint(files);
  }).catch(err => toast(err.message));
}

function renderLogs() {
  $("#app").innerHTML = `<div class="row" style="justify-content:space-between"><div><p class="label">Gateway</p><h1>Logs</h1></div><button class="btn" id="rel">Refresh</button></div>
    <p class="muted" style="margin:.5rem 0 1rem">Tails openclaw logs, then /tmp/openclaw/*.log.</p>
    <section class="card"><pre class="log mono" id="log">…</pre></section>`;
  const load = async () => {
    try {
      const d = await api("/api/logs?limit=220");
      $("#log").textContent = (d.lines || []).join("\n") || "No log lines.";
    } catch (err) { $("#log").textContent = err.message; }
  };
  $("#rel").onclick = load; load();
}

function renderRoster() {
  const list = agents();
  const legacy = leftover();
  const planned = (state.planned || ["vera","scout","elena","grant","marcus","lens"]).map(id => {
    const a = list.find(x => x.id === id);
    return { id, present: !!a, name: (state.titles && state.titles[id]) || id };
  });
  $("#app").innerHTML = `
    <p class="label">Agents</p>
    <h1>Seats on this gateway</h1>
    <p class="muted" style="max-width:42rem;margin-top:.4rem">Leftover Ken/Aria/Dex seats are normal rows. Delete them here — RESET is optional if you want the wipe-and-seed in one shot.</p>
    <div class="row" style="margin:1rem 0">
      ${legacy.length ? `<button class="btn danger" id="wipe">Delete leftover (${legacy.length})</button>` : ""}
      <button class="btn" id="seed">Seed Vera + five</button>
    </div>
    <div class="grid two" style="margin:1.25rem 0">
      <section class="card">
        <p class="label">On disk</p>
        <h2 style="margin:.35rem 0 .75rem">${legacy.length ? "Leftover eleven" : "No leftover seats"}</h2>
        <div class="grid" style="gap:.45rem">
          ${(state.legacy||["ken","aria","dex","sol","reggie","cleo","connie","lex","finn","ollie","mira"]).map(id => {
            const a = list.find(x => x.id === id);
            if (!a) return "";
            return `<div class="row" style="justify-content:space-between">
              <span class="row" style="gap:.55rem">
                <img src="/avatars/${esc(id)}.jpg" alt="" width="36" height="36" onerror="this.src='/avatars/legacy.jpg'" style="width:2.25rem;height:2.25rem;border-radius:6px;object-fit:cover;outline:1px solid rgb(255 255 255 / .1);outline-offset:-1px" />
                <span>${esc(id)} · present</span>
              </span>
              <span class="row" style="gap:.25rem">
                <a class="btn" href="#/a/${esc(id)}" style="min-height:2.25rem;display:inline-flex;align-items:center;text-decoration:none;padding:0 .75rem">Open</a>
                <button class="btn danger" data-del="${esc(id)}" style="min-height:2.25rem;padding:0 .75rem">Delete</button>
              </span>
            </div>`;
          }).join("") || `<p class="good">None on disk.</p>`}
        </div>
      </section>
      <section class="card">
        <p class="label">Operating six</p>
        <h2 style="margin:.35rem 0 .75rem">Vera + five</h2>
        <div class="grid" style="gap:.45rem">
          ${planned.map(p => `<div class="row" style="justify-content:space-between">
            <span class="row" style="gap:.55rem">
              <img src="/avatars/${esc(p.id)}.jpg" alt="" width="36" height="36" onerror="this.src='/avatars/legacy.jpg'" style="width:2.25rem;height:2.25rem;border-radius:6px;object-fit:cover;outline:1px solid rgb(255 255 255 / .1);outline-offset:-1px" />
              <span>${esc(p.id[0].toUpperCase()+p.id.slice(1))} <span class="muted">· ${esc(p.name)}</span></span>
            </span>
            <span class="badge ${p.present?"good":"warn"}">${p.present?"on disk":"missing"}</span>
          </div>`).join("")}
        </div>
      </section>
    </div>
    <div class="card">
      <p class="label">Optional bulk replace</p>
      <p class="muted" style="margin:.4rem 0 .8rem">Type RESET only if you want delete leftover + seed Vera in one command. You can delete leftover without this.</p>
      <label class="label" for="conf">Type RESET to confirm</label>
      <input id="conf" type="text" autocomplete="off" placeholder="RESET" style="margin:.6rem 0 1rem;max-width:16rem" />
      <div class="row">
        <button class="btn danger" id="go">Replace roster</button>
      </div>
      <pre class="log mono" id="out" style="margin-top:1rem"></pre>
    </div>`;
  const go = $("#go");
  if (go) go.onclick = async () => {
    const v = $("#conf").value.trim();
    go.disabled = true;
    $("#out").textContent = "Working — adding six seats, deleting eleven, setting vera default, restarting gateway…";
    try {
      const d = await api("/api/roster/reset", { method:"POST", body: JSON.stringify({ confirm: v }) });
      $("#out").textContent = JSON.stringify({ backup: d.backup, default: d.default, created: (d.created||[]).map(x=>x.id), deleted: (d.deleted||[]).map(x=>x.id) }, null, 2);
      toast("Roster replaced — Vera is default");
      await refresh();
    } catch (err) { $("#out").textContent = err.message; toast(err.message); }
    finally { go.disabled = false; }
  };
  const wipe = $("#wipe");
  if (wipe) wipe.onclick = async () => {
    if (!confirm("Delete leftover seats?")) return;
    wipe.disabled = true;
    try {
      const d = await delLeftover();
      toast("Deleted leftover (" + ((d.deleted||[]).length) + ")");
      await refresh();
    } catch (err) { toast(err.message); }
    finally { wipe.disabled = false; }
  };
  const seed = $("#seed");
  if (seed) seed.onclick = async () => {
    seed.disabled = true;
    try {
      await api("/api/roster/seed", { method:"POST", body:"{}" });
      toast("Seeded Vera + five");
      await refresh();
    } catch (err) { toast(err.message); }
    finally { seed.disabled = false; }
  };
  $("#app").onclick = async (e) => {
    const b = e.target.closest("[data-del]");
    if (!b) return;
    const id = b.dataset.del;
    if (!confirm("Delete " + id + "?")) return;
    b.disabled = true;
    try {
      await delAgent(id);
      toast("Deleted " + id);
      await refresh();
    } catch (err) { toast(err.message); }
    finally { b.disabled = false; }
  };
}

function renderAgents() {
  renderRoster();
}

function renderOps() {
  $("#app").innerHTML = `<p class="label">CLI</p><h1>Ops</h1>
    <p class="muted" style="margin:.4rem 0 1rem">Skills, channels, and cron as OpenClaw sees them. Channel binds happen after the roster is clean.</p>
    <div class="grid two">
      <section class="card"><h2>Skills</h2><div id="sk" class="row" style="margin-top:.75rem">…</div></section>
      <section class="card"><h2>Channels</h2><div id="ch" style="margin-top:.75rem">…</div></section>
      <section class="card" style="grid-column:1/-1"><h2>Cron</h2><div id="cr" style="margin-top:.75rem">…</div></section>
    </div>`;
  api("/api/skills").then(d => {
    const items = d.skills || [];
    $("#sk").innerHTML = items.length ? items.map(s => `<span class="chip">${esc(s.name || s.id || JSON.stringify(s))}${s.eligible===false?" · off":""}</span>`).join("") : `<p class="empty">No skills listed.</p>`;
  }).catch(e => { $("#sk").textContent = e.message; });
  api("/api/channels").then(d => {
    const items = Array.isArray(d.channels) ? d.channels : [];
    $("#ch").innerHTML = items.length ? items.map(c => `<div class="row" style="justify-content:space-between;margin:.35rem 0"><span>${esc(c.id || c.name)}</span><span class="badge">${esc(c.status || "unknown")}</span></div>`).join("") : `<pre class="log mono">${esc(typeof d.channels === "string" ? d.channels : JSON.stringify(d, null, 2))}</pre>`;
  }).catch(e => { $("#ch").textContent = e.message; });
  api("/api/cron").then(d => {
    const jobs = d.jobs || [];
    $("#cr").innerHTML = jobs.length ? `<pre class="log mono">${esc(JSON.stringify(jobs, null, 2))}</pre>` : `<p class="empty">No cron jobs. Vera may propose clocks; do not enable without founder OK.</p>`;
  }).catch(e => { $("#cr").textContent = e.message; });
}

function renderDoctor() {
  $("#app").innerHTML = `<div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><p class="label">Health</p><h1>Doctor</h1></div>
      <div class="row">
        <button class="btn" id="scan">Scan</button>
        <button class="btn primary" id="fix">Repair</button>
      </div>
    </div>
    <p class="muted" style="max-width:42rem;margin:.5rem 0 1rem">Matches <span class="mono">openclaw doctor</span>. Repair runs <span class="mono">doctor --repair --yes</span> as the user — no sudo. Typical findings on this host: nvm on the gateway PATH, service unit out of date, loopback-only bind.</p>
    <div id="doc">Scanning…</div>`;
  const paint = (d) => {
    const findings = d.findings || [];
    $("#doc").innerHTML = `
      <p class="muted" style="margin-bottom:.85rem">${d.repaired ? "Repair applied (demo or live)." : (d.recommendation || "Read-only scan.")}</p>
      <div class="grid">${findings.map(f => `
        <section class="card finding">
          <div class="row" style="justify-content:space-between">
            <span class="label">${esc(f.checkId || "check")}</span>
            <span class="badge ${f.severity==="warning"||f.severity==="error"?"warn":"good"}">${esc(f.severity || "info")}</span>
          </div>
          <p>${esc(f.message)}</p>
          ${f.path ? `<p class="hint mono">${esc(f.path)}</p>` : ""}
          ${f.fixHint ? `<p class="hint">${esc(f.fixHint)}</p>` : ""}
        </section>`).join("") || `<section class="card"><p class="good">No findings.</p></section>`}
      </div>
      ${d.raw ? `<section class="card" style="margin-top:.75rem"><pre class="log mono">${esc(d.raw)}</pre></section>` : ""}`;
  };
  const scan = async () => {
    try { paint(await api("/api/doctor")); }
    catch (err) { $("#doc").innerHTML = `<p class="bad">${esc(err.message)}</p>`; }
  };
  $("#scan").onclick = scan;
  $("#fix").onclick = async () => {
    $("#fix").disabled = true;
    try {
      await api("/api/doctor/fix", { method:"POST", body:"{}" });
      toast("Repair ran");
      await scan();
    } catch (err) { toast(err.message); }
    finally { $("#fix").disabled = false; }
  };
  scan();
}

function renderConfig() {
  $("#app").innerHTML = `<p class="label">Host</p><h1>Config</h1>
    <p class="muted" style="margin:.4rem 0 1rem">User systemd, loopback gateway, secrets redacted. Do not sudo.</p>
    <div class="grid two" id="cfg-top"><section class="card">Loading…</section></div>
    <section class="card" style="margin-top:.75rem">
      <p class="label">HEARTBEAT.md</p>
      <textarea id="hb" class="mono ed" style="min-height:10rem;margin-top:.6rem"></textarea>
      <div class="row" style="margin-top:.75rem"><button class="btn" id="save-hb">Save heartbeat</button></div>
    </section>
    <section class="card" style="margin-top:.75rem">
      <p class="label">openclaw.json (redacted)</p>
      <pre class="log mono" id="raw" style="margin-top:.6rem">…</pre>
    </section>`;
  Promise.all([api("/api/config"), api("/api/service")]).then(([cfg, svc]) => {
    $("#cfg-top").innerHTML = `
      <section class="card">
        <p class="label">Service</p>
        <h2 style="margin:.3rem 0 .7rem">${esc(svc.unit || "openclaw-gateway.service")}</h2>
        <div class="facts">
          <div><dt>State</dt><dd>${esc(svc.ActiveState || "—")} / ${esc(svc.SubState || "")}</dd></div>
          <div><dt>PID</dt><dd class="mono">${esc(svc.MainPID || "—")}</dd></div>
          <div><dt>Unit</dt><dd class="mono">${esc(svc.FragmentPath || state.serviceFile || "")}</dd></div>
          <div><dt>Env</dt><dd class="mono">${esc(svc.Environment || "OPENCLAW_GATEWAY_PORT=18789")}</dd></div>
        </div>
        <p class="muted" style="margin-top:.85rem">${esc(svc.note || "")}</p>
      </section>
      <section class="card">
        <p class="label">Backups</p>
        <h2 style="margin:.3rem 0 .7rem">${esc(cfg.path || "~/.openclaw/openclaw.json")}</h2>
        ${(cfg.backups||[]).length ? cfg.backups.map(b => `<div class="row" style="justify-content:space-between;margin:.3rem 0"><span class="mono" style="font-size:12px">${esc(b.name)}</span><span class="muted" style="font-size:12px">${esc(b.mtime||"")}</span></div>`).join("") : `<p class="empty">No json backups listed.</p>`}
      </section>`;
    $("#hb").value = cfg.heartbeat || "";
    $("#raw").textContent = JSON.stringify(cfg.config || {}, null, 2);
  }).catch(err => { $("#cfg-top").innerHTML = `<p class="bad">${esc(err.message)}</p>`; });
  $("#save-hb").onclick = async () => {
    try {
      await api("/api/heartbeat", { method:"POST", body: JSON.stringify({ heartbeat: $("#hb").value }) });
      toast("Heartbeat saved");
    } catch (err) { toast(err.message); }

}

function render() {
  navOn();
  const h = hash();
  if (h.startsWith("/a/")) return renderAgent(h.slice(3));
  if (h === "/logs") return renderLogs();
  if (h === "/ops") return renderOps();
  if (h === "/roster" || h === "/agents") return renderRoster();
  if (h === "/doctor") return renderDoctor();
  if (h === "/config") return renderConfig();
  renderOverview();
}

async function refresh() {
  try {
    const s = await api("/api/status", { timeout: 20000 });
    state = Object.assign(state || {}, s);
  } catch (err) {
    if (!state) state = { agents: [], gateway: {} };
    state.error = String(err.message || err);
    toast(state.error);
  }
  render();
}

window.addEventListener("hashchange", () => { if (state) render(); });
state = {
  agents: [],
  gateway: {},
  planned: ["vera","scout","elena","grant","marcus","lens"],
  legacy: ["ken","aria","dex","sol","reggie","cleo","connie","lex","finn","ollie","mira"],
  titles: {},
  openclawVersion: "2026.8.2",
};
render();
refresh();
</script>
